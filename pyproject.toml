[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "psidl"
version = "0.3.0"
description = "Positive selection inference from codon alignments"
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "Han Liu"}, {name = "Hongjiu Zhang"}, {name = "Zhengting Zou"}]
dependencies = ["numpy>=2.3,<3", "torch>=2.8,<3"]

[project.optional-dependencies]
inference = ["ete3==3.1.3", "six>=1.16,<2"]
simulation = ["scipy>=1.11,<2", "ete3==3.1.3", "six>=1.16,<2"]

[project.scripts]
psidl-predict = "psidl.predict:main"

[tool.setuptools.packages.find]
where = ["src"]

